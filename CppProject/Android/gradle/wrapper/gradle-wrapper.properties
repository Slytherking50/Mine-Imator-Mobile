# Gradle wrapper for the Android build (QT_ANDROID_PACKAGE_SOURCE_DIR).
# Gradle 8.9 matches AGP 8.7.0's own published compatibility table alongside
# build-tools 34.0.0 / JDK 17 / NDK r27, which is what's actually installed
# on the build machine - see build.gradle in this same directory for why.
# Provided explicitly because the Gradle wrapper bundled with Qt 5.15.19's own
# android templates predates AGP 8.x and would pull an incompatible Gradle version
# if androiddeployqt fell back to it instead of this one.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
