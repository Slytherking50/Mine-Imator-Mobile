# Required since the auto-update feature (2026-09-16) added the project's first-ever
# AndroidX dependency (androidx.core:core, for FileProvider - see build.gradle). Without this,
# Gradle fails ':compileDebugAidl' with "Configuration `:debugRuntimeClasspath` contains
# AndroidX dependencies, but the `android.useAndroidX` property is not enabled". Placed here
# (ANDROID_PACKAGE_SOURCE_DIR) rather than editing the generated android-build/gradle.properties
# directly - androiddeployqt copies this whole directory into the build tree on every run
# (copyFiles(), main.cpp), and its own gradle.properties generation reads+merges rather than
# overwrites (readGradleProperties/mergeGradleProperties), so this key survives alongside the
# keys androiddeployqt manages itself (qtMinSdkVersion, androidNdkVersion, etc.).
android.useAndroidX=true
